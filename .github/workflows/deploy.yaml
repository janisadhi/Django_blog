name: CI 

on:
  push:
    branches: [master]

env:
  IMAGE: django-blogs

jobs:
  buid: 
    name: django build
    runs-on: ubuntu-latest
    steps:
      - name: code checkout 
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USR }}
          password: ${{ secrets.DOCKERHUB_PASS }}

      - name: Docker Build 
        run: docker build -t ${{env.IMAGE}} .

      - name: Docker Tag
        run: docker tag ${{env.IMAGE}} ${{secrets.DOCKERHUB_USR}}/${{env.IMAGE}}:${{github.sha}} 

      - name: Docker Image push 
        run: docker push ${{secrets.DOCKERHUB_USR}}/${{env.IMAGE}}:${{github.sha}} 

      



      

        